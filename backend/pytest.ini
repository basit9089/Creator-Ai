[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
# ------
# integration: exercises a real local Ollama server. Skipped unless
# RUN_OLLAMA_INTEGRATION=1 is set.
# live_research: searches the internet and fetches real pages. Skipped
# unless RUN_RESEARCH_INTEGRATION=1 is set.
# anyio: runs the coroutine test on the anyio event loop (anyio plugin)
markers =
    integration: requires a running local Ollama server
    live_research: performs a real web search and fetches real sources
    anyio: runs the coroutine test on the anyio event loop (anyio plugin)

# Keep failures readable and stop at the first error in a file.
addopts = -ra --strict-markers --tb=short

# The `app` and `tests` packages are imported by absolute name.
pythonpath = .